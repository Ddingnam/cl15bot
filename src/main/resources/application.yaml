spring:
  application:
    name: cl15bot

server:
  address: 0.0.0.0
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

bot:
  mattermost-member-mappings: ${MATTERMOST_MEMBER_MAPPINGS:}
  mattermost-token: ${MATTERMOST_SLASH_TOKEN:}
  mattermost-base-url: ${MATTERMOST_BASE_URL:https://meeting.ssafy.com}
  notion-token: ${NOTION_TOKEN:}
  notion-data-source-id: ${NOTION_DATA_SOURCE_ID:}
  notion-title-property: ${NOTION_TITLE_PROPERTY:스터디}
  notion-members-data-source-id: ${NOTION_MEMBERS_DATA_SOURCE_ID:}
  notion-study-log-url: ${NOTION_STUDY_LOG_URL:https://www.notion.so/0658a93a6c248228802b01b5750d2b9e}

discord:
  bot-token: ${DISCORD_BOT_TOKEN:}
  guild-id: ${DISCORD_GUILD_ID:}
  member-mappings: ${DISCORD_MEMBER_MAPPINGS:}
