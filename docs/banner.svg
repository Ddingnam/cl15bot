<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="모각봇 - 흩어진 공부 기록, Notion 한 곳에" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.55" stop-color="#5B6CF0"/>
      <stop offset="1" stop-color="#4C8DF6"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1200" height="320" rx="28"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1E1B5E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- 배경 장식 -->
    <circle cx="1090" cy="-10" r="200" fill="#FFFFFF" opacity="0.07"/>
    <circle cx="620" cy="360" r="180" fill="#FFFFFF" opacity="0.06"/>
    <circle cx="40" cy="30" r="90" fill="#FFFFFF" opacity="0.05"/>

    <!-- 텍스트 -->
    <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', sans-serif" fill="#FFFFFF">
      <rect x="80" y="64" width="86" height="32" rx="16" fill="#FFFFFF" opacity="0.2"/>
      <text x="123" y="86" font-size="16" font-weight="700" text-anchor="middle">v1.0.0</text>

      <text x="80" y="188" font-size="84" font-weight="800" letter-spacing="-2">모각봇</text>
      <text x="82" y="236" font-size="26" font-weight="500" opacity="0.92">흩어진 공부 기록, Notion 한 곳에</text>
      <text x="82" y="272" font-size="17" font-weight="500" opacity="0.7">Mattermost · Discord  →  Notion Study Log</text>
    </g>

    <!-- 말풍선 (채팅 입력) -->
    <g filter="url(#shadow)">
      <rect x="716" y="52" width="68" height="42" rx="14" fill="#FFFFFF" opacity="0.95"/>
      <path d="M732 94 L728 106 L746 94 Z" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="736" cy="73" r="4" fill="#6C5CE7"/>
      <circle cx="750" cy="73" r="4" fill="#6C5CE7" opacity="0.7"/>
      <circle cx="764" cy="73" r="4" fill="#6C5CE7" opacity="0.4"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="726" y="228" width="68" height="42" rx="14" fill="#FFFFFF" opacity="0.8"/>
      <path d="M776 270 L782 282 L762 270 Z" fill="#FFFFFF" opacity="0.8"/>
      <rect x="740" y="243" width="40" height="8" rx="4" fill="#6C5CE7" opacity="0.6"/>
    </g>

    <!-- 시계 -->
    <g transform="translate(850 160)">
      <circle r="84" fill="#FFFFFF" opacity="0.14"/>
      <circle r="70" fill="#FFFFFF" opacity="0.96" filter="url(#shadow)"/>
      <circle r="84" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"
              stroke-dasharray="396 528" transform="rotate(-90)" opacity="0.95"/>
      <!-- 눈금 -->
      <g stroke="#CFCBF5" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-58" x2="0" y2="-50"/>
        <line x1="58" y1="0" x2="50" y2="0"/>
        <line x1="0" y1="58" x2="0" y2="50"/>
        <line x1="-58" y1="0" x2="-50" y2="0"/>
      </g>
      <!-- 바늘 -->
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#6C5CE7" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="28" y2="16" stroke="#4C8DF6" stroke-width="6" stroke-linecap="round"/>
      <circle r="7" fill="#6C5CE7"/>
    </g>

    <!-- 화살표 -->
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
      <path d="M948 160 H982" stroke-dasharray="2 10"/>
      <path d="M978 148 L992 160 L978 172"/>
    </g>

    <!-- 기록 카드 (Study Log) -->
    <g filter="url(#shadow)">
      <rect x="1004" y="76" width="128" height="168" rx="18" fill="#FFFFFF"/>
      <rect x="1022" y="96" width="62" height="10" rx="5" fill="#6C5CE7"/>

      <circle cx="1030" cy="136" r="9" fill="#6C5CE7"/>
      <path d="M1025.5 136 L1029 139.5 L1035 132.5" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1048" y="132" width="66" height="8" rx="4" fill="#DAD7F8"/>

      <circle cx="1030" cy="170" r="9" fill="#6C5CE7"/>
      <path d="M1025.5 170 L1029 173.5 L1035 166.5" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1048" y="166" width="52" height="8" rx="4" fill="#DAD7F8"/>

      <circle cx="1030" cy="204" r="9" fill="#6C5CE7"/>
      <path d="M1025.5 204 L1029 207.5 L1035 200.5" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1048" y="200" width="60" height="8" rx="4" fill="#DAD7F8"/>
    </g>
  </g>
</svg>
